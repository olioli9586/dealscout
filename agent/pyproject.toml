[project]
name = "dealscout-agent"
version = "0.1.0"
description = "DealScout v2: the LangGraph research workflow behind the Next.js app"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.0",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3.0",
    "psycopg[binary,pool]>=3.3.8",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "uvicorn>=0.54.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
# Runs on every Vercel build of this service: applies migrations/ and the
# checkpointer's tables (skips when the environment has no database).
build = "python -m app.migrate"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
